<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#121923"><title>Читалка — Сорок минут до дома</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=PT+Serif:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style/style.css"><link rel="stylesheet" href="style/reader.css"><script type="module" src="js/main.js"></script></head>
<body data-page="reader"><a class="skip-link" href="#main">Перейти к содержимому</a><header id="site-header"></header><main id="main" class="reader-shell">
  <div class="reader-top"><a class="back-link" href="books.html">← К томам</a><button class="icon-button" id="settings-toggle" aria-expanded="false" aria-controls="reader-settings">Настройки чтения <span aria-hidden="true">⚙</span></button></div>
  <aside class="reader-settings" id="reader-settings" hidden>
    <label>Размер текста <input id="font-size" type="range" min="16" max="26" value="20"></label>
    <label>Межстрочный интервал <input id="line-height" type="range" min="14" max="22" value="18"></label>
    <label>Ширина колонки <input id="column-width" type="range" min="560" max="900" value="720"></label>
    <label>Шрифт <select id="reader-font"><option value="serif">PT Serif</option><option value="sans">Manrope</option></select></label>
    <label>Тема <select id="reader-theme"><option value="night">Ночная</option><option value="paper">Бумага</option><option value="sepia">Сепия</option></select></label>
    <button class="text-link" id="focus-mode" type="button">Режим концентрации</button><button class="text-link" id="fullscreen" type="button">На весь экран</button>
  </aside>
  <div class="reader-controls"><label>Том <select id="volume-select" aria-label="Выбрать том"></select></label><label>Глава <select id="chapter-select" aria-label="Выбрать главу"></select></label><button id="bookmark-toggle" class="icon-button" type="button">☆ Закладка</button></div>
  <section class="reader-content" id="reader-content" aria-live="polite"><p class="loading-state">Загружаем главу…</p></section>
  <nav class="chapter-navigation" aria-label="Навигация по главам"><button id="previous-chapter" class="text-link" type="button">← Предыдущая</button><span id="chapter-counter"></span><button id="next-chapter" class="text-link" type="button">Следующая →</button></nav>
  <section class="bookmark-list"><h2>Закладки</h2><div id="bookmarks"></div></section>
</main><footer id="site-footer"></footer><div id="player-mount"></div></body></html>
