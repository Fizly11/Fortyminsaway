<h1>Второй том</h1>
<p id="p-001">Здесь будет размещён авторский текст главы второго тома. Название тома намеренно не указано и остаётся редактируемым в файле data/books.json.</p>
<p id="p-002">Это техническая заглушка, а не фрагмент романа или описание событий.</p>
